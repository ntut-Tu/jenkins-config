name: Validate Jenkins configuration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m jenkins_config render --settings settings.example.yaml
      - run: docker compose -f .state/compose.yaml config --quiet
